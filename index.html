        :root {
            --primary: #009ef7;
            --primary-dark: #0077c8;
            --primary-tint: #e9f6fe;
            --ink: #181c32;
            --ink-2: #5e6278;
            --ink-3: #a1a5b7;
            --line: #d7d7d9;
            --canvas: #f7f8fb;
            --shadow-sm: 0 1px 2px rgba(24, 28, 50, 0.04);
            --shadow-md: 0 12px 32px rgba(24, 28, 50, 0.08);
        }

        /* ===== 全局 ===== */
        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #fff;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }
        ::selection {
            background-color: var(--primary-tint);
            color: var(--primary-dark);
        }
        main.bg-white {
            background-color: #ffffff !important
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 264px;
            background-color: #fff;
            border-right: 1px solid var(--line);
        }
        .sidebar .nav-link {
            color: var(--ink-2);
            border-radius: 0.625rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
            cursor: pointer;
        }
        .sidebar .nav-link:hover {
            background-color: #f5f8fa;
            color: var(--ink);
            transform: translateX(2px);
        }
        .sidebar .nav-link.active {
            background-color: var(--primary-tint);
            color: var(--primary);
            font-weight: 600;
        }
        .sidebar .nav-link.active:hover {
            background-color: var(--primary-tint);
            color: var(--primary);
        }
        .sidebar .nav-link svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            opacity: 0.75;
        }
        .sidebar .nav-link.active svg {
            opacity: 1;
        }
        .sidebar .section-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--ink-3);
            padding: 0.375rem 0.75rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease;
        }
        .sidebar .section-label:hover {
            color: var(--ink-2);
        }
        .sidebar .section-label .plus {
            color: #c0c4d0;
            font-size: 0.875rem;
            line-height: 1;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .sidebar .section-label:hover .plus {
            color: var(--primary);
        }
        .sub-menu {
            display: none;
        }
        .sub-menu.open {
            display: flex;
            gap: 2px;
        }

        /* ===== 顶部导航 ===== */
        .topbar {
            height: 64px;
            border-bottom: 1px solid var(--line);
            background-color: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar .nav-link-custom {
            position: relative;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--ink);
            padding: 0.25rem 0.25rem 0.25rem 0;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .topbar .nav-link-custom::after {
            content: '';
            position: absolute;
            left: 0.5rem;
            right: 100%;
            bottom: -3px;
            height: 2px;
            border-radius: 2px;
            background-color: var(--primary);
            transition: right 0.25s ease;
        }
        .topbar .nav-link-custom:hover {
            color: var(--primary);
        }
        .topbar .nav-link-custom:hover::after {
            right: 0.5rem;
        }

        /* ===== 图标按钮 ===== */
        .icon-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--line);
            border-radius: 0.625rem;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-3);
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            padding: 0;
        }
        .icon-btn:hover {
            background-color: var(--primary-tint);
            border-color: transparent;
            color: var(--primary);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ===== 品牌 Logo ===== */
        .brand-logo {
            width: 1.75rem;
            height: 1.25rem;
            background: linear-gradient(135deg, #1e1e2f 0%, #3d3d5c 100%);
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .avatar-box {

            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 600;
            overflow: hidden;
            flex-shrink: 0;
            background-color: #fff;
            transition: transform 0.25s ease;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-yellow {
            background-color: #ffe38c;
            color: #8a6d2b;
        }
        .avatar-purple {
            background-color: #e2e2f6;
            color: #6d6b9b;
        }
        .avatar-pink {
            background-color: #ffcce0;
            color: #bd347c;
        }
        .avatar-green {
            background-color: #d4f5e1;
            color: #3fa769;
        }
        .avatar-light-green {
            background-color: #e4f6ef;
            color: #4ca57d;
        }
        .avatar-orange {
            background-color: #fff1db;
            color: #b47c43;
        }
        .avatar-amber {
            background-color: #fcd34d;
            color: #7c5c10;
        }
        .avatar-blue {
            background-color: #cfe2ff;
            color: #0d6efd;
        }
        .avatar-red {
            background-color: #f8d7da;
            color: #b02a37;
        }
        .avatar-teal {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .avatar-pink-light {
            background-color: #f5c2d1;
            color: #a11f5c;
        }

        .user-card {
            border: 1px solid var(--line);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            background-color: #fff;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
        }
        .user-card:hover {
            box-shadow: var(--shadow-md);
        }
        .user-card h3 a {
            color: var(--ink);
            transition: color 0.15s ease;
        }
        .user-card:hover h3 a {
            color: var(--primary);
        }
        .user-card p {
            font-size: 0.8125rem;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

            color: var(--ink-2);
            background-color: #fff;
            font-size: 0.75rem;
            font-weight: 600;

            border-radius: 0.5rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
        }
        .btn-connect:hover {
            background-color: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 6px 16px rgba(0, 158, 247, 0.32);
            transform: translateY(-1px);
        }

        /* ===== 搜索框 ===== */
        .search-input {
            padding-left: 2.25rem;
            padding-right: 0.75rem;
            padding-top: 0.4375rem;
            padding-bottom: 0.4375rem;
            border: 1px solid var(--line);
            border-radius: 0.625rem;
            font-size: 0.875rem;
            background-color: #fff;
            width: 220px;
            outline: none;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, width 0.25s ease;
        }
        .search-input::placeholder {
            color: #c0c4d0;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 158, 247, 0.12);
            width: 260px;
        }
        .search-wrapper {
            position: relative;
        }
        .search-wrapper .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-3);
            pointer-events: none;
            transition: color 0.2s ease;
        }
        .search-wrapper:focus-within .search-icon {
            color: var(--primary);
        }
        .search-wrapper .search-icon svg {
            width: 16px;
            height: 16px;
        }

        .avatar-stack {
            display: flex;
        }

            height: 32px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            margin-right: -0.5rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease;
        }
        .avatar-stack .stack-item:last-child {
            margin-right: 0;
        }

        /* ===== 文本颜色 ===== */
        .text-metronic-blue {
            color: var(--primary);
        }
        .text-gray-metronic {
            color: var(--ink-3);
        }
        .text-gray-800-custom {
            color: var(--ink);
        }
        .text-gray-600-custom {
            color: var(--ink-2);
        }

        /* ===== 标题 ===== */
        .page-title {
            font-size: 1.625rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.02em;
            position: relative;

            color: var(--ink-3);
            margin-top: 0.25rem;

        .section-count {
            font-size: 0.8125rem !important;
            color: var(--ink-3) !important;

        .overflow-y-auto::-webkit-scrollbar {
            width: 6px;
        }
        .overflow-y-auto::-webkit-scrollbar-thumb {
            background-color: #dcdfe6;
            border-radius: 6px;
        }
        .overflow-y-auto::-webkit-scrollbar-thumb:hover {
            background-color: #c0c4d0;
        }
        .overflow-y-auto::-webkit-scrollbar-track {
            background-color: transparent;
        }

        /* ===== 内容区块切换 ===== */
        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
            animation: fadeUp 0.35s ease both;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .content-section.active {
                animation: none;
            }
        }

        /* ===== 空状态占位 ===== */
        .placeholder-empty {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--ink-3);
            background-color: #fff;
            border: 1px dashed #dcdfe6;
            border-radius: 1rem;
        }
        .placeholder-empty .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .placeholder-empty h4 {
            color: var(--ink);
            font-weight: 600;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 220px;
            }
            .search-input {
                width: 160px;
            }
            .search-input:focus {
                width: 180px;
            }
            .user-card {
                flex-wrap: wrap;
                gap: 1rem;
                padding: 1rem 1.25rem;
            }
            .user-card .card-actions {
                flex-wrap: wrap;
                width: 100%;
                justify-content: flex-start !important;
            }
        }
        @media (max-width: 576px) {
            .sidebar {
                display: none;
            }
            .topbar .nav-links {
                display: none;
            }
            .search-input {
                width: 120px;
            }
            .search-input:focus {
                width: 150px;
            }
        }
    </style>
</head>

;

            // ==================== 工具函数 ====================
            const avatarClasses = [
                'avatar-yellow', 'avatar-purple', 'avatar-pink', 'avatar-green',
                'avatar-light-green', 'avatar-orange', 'avatar-amber', 'avatar-blue',
                'avatar-red', 'avatar-teal', 'avatar-pink-light'
            ];

            function getRandomAvatarClass() {
                return avatarClasses[Math.floor(Math.random() * avatarClasses.length)];
            }

            function getInitial(name) {
                return name ? name.charAt(0).toUpperCase() : '?';
            }

            // 防抖
            function debounce(fn, delay) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            // ==================== 渲染引擎 ====================
            const App = {
                init() {
                    this.renderSidebar();
                    this.renderContent();
                    this.bindEvents();
                    // 默认激活“新闻资讯”
                    this.activate('新闻资讯');
                    // 处理 URL hash
                    this.handleHash();
                },

                // 渲染侧边栏
                renderSidebar() {
                    const nav = document.getElementById('sidebar-nav');
                    let html = '';
                    const categories = Object.keys(DATA);

                    categories.forEach((catName) => {
                        const cat = DATA[catName];
                        const subKeys = Object.keys(cat.sub);
                        const isOpen = (catName === '媒体'); // 默认展开媒体
                        const openClass = isOpen ? 'open' : '';
                        const plusRotate = isOpen ? 'transform:rotate(45deg);' : '';

                        html += `<div class="mt-2">`;
                        html += `<div class="section-label" data-category="${catName}">
                                    <span>${catName}</span>
                                    <span class="plus" style="${plusRotate}">+</span>
                                 </div>`;
                        html += `<div class="nav flex-column sub-menu ${openClass}">`;

                        subKeys.forEach(subName => {
                            const isActive = (catName === '媒体' && subName === '新闻资讯');
                            const activeClass = isActive ? 'active' : '';
                            html += `<a href="#" class="nav-link ${activeClass}" data-target="${subName}">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                        </svg>
                                        ${subName}
                                    </a>`;
                        });

                        html += `</div></div>`;
                    });

                    nav.innerHTML = html;
                },

                // 渲染内容区域
                renderContent() {
                    const container = document.getElementById('content-container');
                    let html = '';
                    const categories = Object.keys(DATA);

                    categories.forEach(catName => {
                        const cat = DATA[catName];
                        const subKeys = Object.keys(cat.sub);
                        subKeys.forEach(subName => {
                            const sub = cat.sub[subName];
                            const isActive = (catName === '媒体' && subName === '新闻资讯');
                            const activeClass = isActive ? 'active' : '';

                            html += `<div class="content-section ${activeClass} px-4 px-md-5 py-4 py-md-5" id="${subName}">`;
                            html += `<div class="mb-4">
                                        <h1 class="page-title">${subName}</h1>
                                    </div>`;

                            const sites = sub.sites || [];
                            html += `<div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
                                        <span class="text-gray-600-custom fs-6 section-count">共 ${sites.length} 个</span>
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="search-wrapper">
                                                <span class="search-icon">
                                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                                    </svg>
                                                </span>
                                                <input type="text" class="search-input" placeholder="网站名称，网站描述" data-section="${subName}" />
                                            </div>
                                        </div>
                                    </div>`;

                            if (sites.length) {
                                html += `<div class="d-flex flex-column gap-3" id="list-${subName}">`;
                                sites.forEach(site => {
                                    const avatarClass = getRandomAvatarClass();
                                    let avatarContent;
                                    if (site.logo && site.logo.startsWith('http')) {
                                        avatarContent = `<img src="${site.logo}" alt="${site.name}" loading="lazy" />`;
                                    } else {
                                        avatarContent = `<span style="font-size:1.5rem;font-weight:600;">${getInitial(site.name)}</span>`;
                                    }
                                    html += `<div class="user-card d-flex align-items-center gap-3 gap-md-4 flex-wrap flex-md-nowrap">
                                                <div class="avatar-box flex-shrink-0">
                                                    ${avatarContent}
                                                </div>
                                                <div class="flex-grow-1 min-w-0">
                                                    <div class="d-flex align-items-center gap-2 mb-1">
                                                        <h3 class="fs-6 fw-semibold text-metronic-blue mb-0" style="cursor:pointer;">
                                                            <a href="${site.url}" target="_blank" style="text-decoration: none;">${site.name}</a>
                                                        </h3>
                                                    </div>
                                                    <p class="text-gray-600-custom fs-7 mb-0">${site.desc}</p>
                                                </div>
                                                <div class="d-flex align-items-center gap-3 flex-shrink-0 card-actions">
                                                    <div class="avatar-stack">
                                                        <span class="stack-item avatar-amber">A</span>
                                                        <span class="stack-item avatar-purple">B</span>
                                                        <span class="stack-item avatar-green">C</span>
                                                    </div>
                                                    <a href="${site.url}" target="_blank" class="btn-connect">访问网站</a>
                                                </div>
                                            </div>`;
                                });
                                html += `</div>`;
                            } else {
                                html += `<div class="placeholder-empty">
                                            <div class="empty-icon">📭</div>
                                            <h4>暂无站点收录</h4>
                                            <p class="text-muted">该分类下的站点正在收集中，敬请期待</p>
                                        </div>`;
                            }

                            html += `</div>`;
                        });
                    });

                    container.innerHTML = html;
                },

                // 激活指定分类
                activate(targetId) {
                    // 更新侧边栏激活状态
                    document.querySelectorAll('.sidebar .nav-link').forEach(link => {
                        link.classList.toggle('active', link.dataset.target === targetId);
                    });
                    // 更新内容显示
                    document.querySelectorAll('.content-section').forEach(section => {
                        section.classList.toggle('active', section.id === targetId);
                    });
                    // 更新 URL hash
                    if (history.pushState && targetId !== location.hash.replace('#', '')) {
                        history.pushState(null, '', `#${targetId}`);
                    }
                },

                // 搜索过滤（防抖）
                filterSites(sectionId, query) {
                    const list = document.getElementById(`list-${sectionId}`);
                    if (!list) return;
                    const q = query.trim().toLowerCase();
                    const cards = list.querySelectorAll('.user-card');
                    let visible = 0;
                    cards.forEach(card => {
                        const name = card.dataset.name || '';
                        const desc = card.dataset.desc || '';
                        const match = !q || name.includes(q) || desc.includes(q);
                        card.style.display = match ? '' : 'none';
                        if (match) visible++;
                    });
                    // 更新计数
                    const countSpan = list.closest('.content-section')?.querySelector('.section-count');
                    if (countSpan) {
                        const total = cards.length;
                        countSpan.textContent = q ? `显示 ${visible} 个（共 ${total} 个）` : `显示 ${total} 个`;
                    }
                },

                // 处理 URL hash
                handleHash() {
                    const hash = location.hash.replace('#', '');
                    if (hash && document.getElementById(hash)) {
                        this.activate(hash);
                    }
                },

                // 事件绑定
                bindEvents() {
                    // 侧边栏导航点击（事件委托）
                    document.getElementById('sidebar-nav').addEventListener('click', (e) => {
                        const link = e.target.closest('.nav-link');
                        if (link) {
                            e.preventDefault();
                            const target = link.dataset.target;
                            if (target) this.activate(target);
                        }
                    });

                    // 分类折叠（事件委托）
                    document.getElementById('sidebar-nav').addEventListener('click', (e) => {
                        const label = e.target.closest('.section-label');
                        if (label) {
                            const subMenu = label.nextElementSibling;
                            if (subMenu && subMenu.classList.contains('sub-menu')) {
                                subMenu.classList.toggle('open');
                                const plus = label.querySelector('.plus');
                                if (plus) {
                                    plus.style.transform = subMenu.classList.contains('open') ? 'rotate(45deg)' :
                                        'rotate(0deg)';
                                }
                            }
                        }
                    });

                    // 搜索框输入（防抖）
                    document.getElementById('content-container').addEventListener('input', (e) => {
                        const input = e.target.closest('.search-input');
                        if (input) {
                            const section = input.dataset.section;
                            const handler = debounce((q) => {
                                this.filterSites(section, q);
                            }, 200);
                            handler(input.value);
                        }
                    });

                    // 浏览器前进/后退
                    window.addEventListener('popstate', () => {
                        this.handleHash();
                    });
                }
            };

            // ==================== 启动 ====================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => App.init());
            } else {
                App.init();
            }

        })();
    </script>
